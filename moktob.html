    const sheetURL =
      "https://opensheet.elk.sh/1uzehSN2lGI6gNlM8w3eHEEbyZ14UcoRCBuOldH0Rljc/Sheet3";

    let allData = [];
    let displayIndex = 0;
    const batchSize = 50;

    async function fetchData() {
      const res = await fetch(sheetURL);
      allData = await res.json();
      loadMore();
    }

    function loadMore() {
      const tableBody = document.getElementById("tableBody");
      const nextIndex = displayIndex + batchSize;
      const chunk = allData.slice(displayIndex, nextIndex);

      chunk.forEach((row) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${row.TimeStamp}</td>
          <td>${row.Pname}</td>
           <td>${row.Father}</td>
           <td>${row.Mother}</td>
            <td>${row.Code}</td>
          <td>${row.Address}</td>
          <td><a href="tel:${row.Phone}">${row.Phone}</a></td>
          <td><a href="https://wa.me/${row.Phone}" target="_blank">${row.Phone}</a></td>
          <td>${row.Age}</td>
          <td>${row.Time}</td>
          <td>
                <button onclick="alert('${row.Description.replace(/'/g, "\\'")}')">massege</button>
            </td>
          <td>${row.TransactionID}</td>
         <td>${row.Paid}</td>
        `;
        tableBody.appendChild(tr);
      });

      displayIndex = nextIndex;

      if (displayIndex >= allData.length) {
        document.getElementById("loadMoreBtn").style.display = "none";
      }
    }

function showByCategory() {

      });

      let text = "Religion:\n";
      Object.keys(map).forEach((Category) => {
        text += `${Category}: ${map[Category]} student\n`;
      });

      alert(text);
    }

    
    function showToday() {
  const now = new Date();
  const d = now.getDate();
  const m = now.getMonth();
  const y = now.getFullYear();

  const count = allData.filter((row) => {
    const t = new Date(row.Timestamp);
    return (
      t.getDate() === d &&
      t.getMonth() === m &&
      t.getFullYear() === y
    );
  }).length;

  alert(`Today: ${count} student`);
}

    function showThisMonth() {
      const now = new Date();
      const month = now.getMonth() + 1;
      const year = now.getFullYear();

      const count = allData.filter((d) => {
        const date = new Date(d.Timestamp);
        return (
          date.getMonth() + 1 === month &&
          date.getFullYear() === year
        );
      }).length;

      alert(`month: ${count} studen`);
    }

    function showTotalMoney() {
      const total = allData.reduce((sum, d) => sum + Number(d.Taka || 0), 0);
      alert(`Total tk: ${total} tk`);

<script>
fetch("https://opensheet.elk.sh/1uzehSN2lGI6gNlM8w3eHEEbyZ14UcoRCBuOldH0Rljc/Sheet1")
  .then(res => res.json())
  .then(data => {

    const today = new Date();
    const todayStr = today.toISOString().split('T')[0];

    const currentMonth = today.getMonth();
    const currentYear = today.getFullYear();

    let total = 0;
    let todayCount = 0;
    let monthCount = 0;

    data.forEach(item => {

      total++;

      // Timestamp না থাকলে skip
      if (!item.TimeStamp) return;

      let itemDate = new Date(item.TimeStamp);

      // invalid date skip
      if (isNaN(itemDate)) return;

      let itemDateStr = itemDate.toISOString().split('T')[0];

      // আজকের count
      if (itemDateStr === todayStr) {
        todayCount++;
      }

      // এই মাসের count
      if (
        itemDate.getMonth() === currentMonth &&
        itemDate.getFullYear() === currentYear
      ) {
        monthCount++;
      }

    });

    document.getElementById("total").innerText = total;
    document.getElementById("today").innerText = todayCount;
    document.getElementById("month").innerText = monthCount;

  })
  .catch(err => {
    console.error(err);
    document.getElementById("total").innerText = "Error";
  });

  <script>

/* =====================================================
   GOOGLE SHEET SETTINGS
===================================================== */


/*
   আপনার Google Sheet URL এখানে দিন
*/

const SHEET_URL =
"https://docs.google.com/spreadsheets/d/1uzehSN2lGI6gNlM8w3eHEEbyZ14UcoRCBuOldH0Rljc/edit?usp=sharing";


/*
   আপনার Sheet-এর নাম
*/

const SHEET_NAME = "Sheet1";


/* =====================================================
   GOOGLE SHEET ID
===================================================== */

function getSheetId(url){

    const match = url.match(
        /\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/
    );

    if(!match){

        throw new Error(
            "Google Sheet ID পাওয়া যায়নি"
        );

    }

    return match[1];

}


/* =====================================================
   SHEET ID
===================================================== */

let SHEET_ID = "";

try{

    SHEET_ID = getSheetId(SHEET_URL);

}
catch(error){

    console.error(error);

}


/* =====================================================
   OPENSHEET API
===================================================== */

const API_URL =
SHEET_ID
?
`https://opensheet.elk.sh/${SHEET_ID}/${encodeURIComponent(SHEET_NAME)}`
:
"";


/* =====================================================
   NUMBER CONVERTER
===================================================== */

function number(value){

    if(
        value === undefined ||
        value === null ||
        value === ""
    ){

        return 0;

    }


    let text = String(value)
        .trim()
        .replace(/,/g,"");


    /*
       বাংলা সংখ্যা থাকলেও
       English number-এ convert করবে
    */

    const bangla =
        "০১২৩৪৫৬৭৮৯";

    const english =
        "0123456789";


    text = text.replace(
        /[০-৯]/g,
        function(char){

            return english[
                bangla.indexOf(char)
            ];

        }
    );


    const result =
        parseFloat(text);


    return isNaN(result)
        ? 0
        : result;

}


/* =====================================================
   MONEY FORMAT
===================================================== */

function money(amount){

    return new Intl.NumberFormat("bn-BD")
        .format(amount) + " টাকা";

}


/* =====================================================
   DATA LOAD
===================================================== */

async function loadData(){

    const container =
        document.getElementById("account");


    try{

        /* =========================
           CHECK API
        ========================= */

        if(!API_URL){

            throw new Error(
                "Google Sheet URL ঠিক নেই"
            );

        }


        /* =========================
           FETCH OPENSHEET
        ========================= */

        const response =
            await fetch(API_URL);


        if(!response.ok){

            throw new Error(
                "OpenSheet থেকে Data পাওয়া যায়নি"
            );

        }


        const data =
            await response.json();


        /* =================================================
           এখানে সমস্ত Sheet-এর শিক্ষার্থী হিসাব হবে
        ================================================= */


        let totalMoney = 0;

        let totalPaid = 0;

        let paidStudents = 0;

        let notPaidStudents = 0;


        /* =================================================
           প্রতিটি শিক্ষার্থী
        ================================================= */

        data.forEach(function(student){


            /* =========================
               Fee
            ========================= */

            const fee =
                number(student.Fee);


            /* =========================
               Paid
            ========================= */

            const paid =
                number(student.Paid);


            /* =========================
               মোট টাকা
            ========================= */

            totalMoney += fee;


            /* =========================
               মোট জমা
            ========================= */

            totalPaid += paid;


            /* =========================
               জমা করেছে / করেনি
            ========================= */


            /*
               Paid 0-এর বেশি হলে
               জমা করেছে ধরা হবে
            */

            if(paid > 0){

                paidStudents++;

            }
            else{

                notPaidStudents++;

            }

        });


        /* =================================================
           30% হিসাব
        ================================================= */

        const total30 =
            totalMoney * 30 / 100;


        const paid30 =
            totalPaid * 30 / 100;


        /* =================================================
           RESULT SHOW
        ================================================= */

        container.innerHTML = `

            <!-- HEADER -->

            <div class="header">

                <div class="header-title">
                    শিক্ষার্থীদের মোট হিসাব
                </div>

                <div class="header-code">
                    সকল শিক্ষার্থী
                </div>

            </div>
             <!-- মোট শিক্ষার্থী -->

            <div class="student-count">

                <div>
                    মোট শিক্ষার্থী
                </div>

                <div class="student-number">
                    ${data.length} জন
                </div>

            </div>


            <!-- হিসাব -->

            <div class="grid">


                <!-- মোট টাকা -->

                <div class="box">

                    <div class="title">
                        মোট টাকা
                    </div>

                    <div class="value total">
                        ${money(totalMoney)}
                    </div>

                </div>


                <!-- জমা -->

                <div class="box">

                    <div class="title">
                        জমা
                    </div>

                    <div class="value paid">
                        ${money(totalPaid)}
                    </div>

                </div>


                <!-- মোট টাকার ৩০% -->

                <div class="box">

                    <div class="title">
                        মোট টাকার ৩০%
                    </div>

                    <div class="value percent">
                        ${money(total30)}
                    </div>

                </div>


                <!-- জমার ৩০% -->

                <div class="box">

                    <div class="title">
                        জমার ৩০%
                    </div>

                    <div class="value percent">
                        ${money(paid30)}
                    </div>

                </div>


                <!-- জমা করেছে -->

                <div class="box">

                    <div class="title">
                        জমা করেছে
                    </div>

                    <div class="value paid">
                        ${paidStudents} জন
                    </div>

                </div>


                <!-- জমা করেনি -->

                <div class="box">

                    <div class="title">
                        জমা করেনি
                    </div>

                    <div class="value notpaid">
                        ${notPaidStudents} জন
                    </div>

                </div>


            </div>


           

        `;


    }
    catch(error){

        console.error(error);

        container.innerHTML = `

            <div class="error">

                হিসাব লোড করা যাচ্ছে না।

                <br><br>

                Google Sheet URL,
                Sheet Name এবং
                Header পরীক্ষা করুন।

            </div>

        `;

    }

}


/* =====================================================
   START
===================================================== */

loadData();

</script>

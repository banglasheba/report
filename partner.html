    .accordion-btn {

  width:100%; padding:12px; text-align:center;

  border:none; outline:none; background:#008080; color:white;

  font-size:16px; margin-top:5px; border-radius:5px; cursor:pointer;

}

.accordion-content {display:none; padding:10px; background:#f1f1f1; border-radius:5px;}
    .collapsible {

  background-color: #198754;

  color: white;

  cursor: pointer;

  padding: 12px;

  width: 100%;

  text-align: left;

  border: none;

  outline: none;

  font-size: 16px;

  border-radius: 6px;

  margin-top: 10px;

}

.active, .collapsible:hover {

  background-color: #157347;

}

.content {

  padding: 0 18px;

  display: none;

  overflow: hidden;

  background-color: #f1f1f1;

  border-radius: 6px;

  margin-bottom: 10px;

}
    
    .slider-container {
  width: 100%;
  position: relative;
  height: 220px; /* প্রয়োজন অনুযায়ী */
  overflow: hidden;
  border-radius: 10px;
  margin-bottom: 20px;
}

.slider {
  position: relative;
  width: 100%;
  height: 100%;
}

.slider img {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  animation: fadeSlide 9s infinite;
}

.slider img:nth-child(1) { animation-delay: 0s; }
.slider img:nth-child(2) { animation-delay: 3s; }
.slider img:nth-child(3) { animation-delay: 6s; }

@keyframes fadeSlide {
  0% {opacity: 0;}
  10% {opacity: 1;}
  30% {opacity: 1;}
  40% {opacity: 0;}
  100% {opacity: 0;}
}

    .filters {padding:15px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap; background:#fff;}
    .filters input, .filters select {padding:8px; border:1px solid #ccc; border-radius:5px; width:auto; min-width:140px;}
    
    
    .posts {display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr)); gap:10px; padding:auto;}
    .card {background:white; border-radius:10px; padding:5px; box-shadow:0 2px 5px rgba(0,0,0,0.2);}
    .card img {width:100%; height:150px; object-fit:cover; border-radius:10px;}
    .card h3 {margin:5px 0;}
    .order-btn {background:#4CAF50; color:white; padding:10px 12px; border:none; border-radius:5px; cursor:pointer;}
    .locked {opacity:0.5; pointer-events:none;}
    
    /* Modal */
    .modal {display:none; position:fixed; top:0; left:0; width:70%; height:90%; background:rgba(0,0,0,0.6); justify-content:center; align-items:center;}
    .modal-content {background:white; padding:20px; border-radius:10px; width:90%; max-width:700px;}
    .modal-content input, textarea, select {width:100%; margin-bottom:10px; padding:8px; border:1px solid #ccc; border-radius:5px;}
    .close {float:right; cursor:pointer; color:red;}
    #loadMoreBtn {display:block; margin:20px auto; background:#007bff; color:white; border:none; padding:10px 20px; border-radius:5px; cursor:pointer;}
    
    /* Right button */
.toggle-btn{
  position: fixed;
  right: 10px;
  top: 40%;
  background: #0a7cff;
  color: #fff;
  padding: 10px 14px;
  border-radius: 6px 0 0 6px;
  cursor: pointer;
  z-index: 1001;
  font-size: 14px;
}

/* List box */
.list-box{
  position: fixed;
  right: -320px;
  top: 30%;
  width: 320px;
  background: #ffffff;
  border: 1px solid #ddd;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  transition: 0.3s;
  z-index: 1000;
}

.list-box.active{
  right: 0;
}

.list-box ul{
  list-style: none;
  margin: 0;
  padding: 0;
}

.list-box li{
  border-bottom: 1px solid #eee;
}

.list-box li a{
  display: block;
  padding: 20px;
  text-decoration: none;
  color: #333;
  font-size: 14px;
}

.list-box li a:hover{
  background: #f1f1f1;
}

  <script>
fetch("https://opensheet.elk.sh/1uzehSN2lGI6gNlM8w3eHEEbyZ14UcoRCBuOldH0Rljc/Sheet2")
  .then(res => res.json())
  .then(data => {

    const today = new Date();
    const todayStr = today.toISOString().split('T')[0];

    const currentMonth = today.getMonth();
    const currentYear = today.getFullYear();

    let total = 0;
    let todayCount = 0;
    let monthCount = 0;

    data.forEach(item => {
      if (item.Code == "7080") {

        total++;

        if (!item.TimeStamp) return;

        let itemDate = new Date(item.TimeStamp);

        if (isNaN(itemDate)) return;

        let itemDateStr = itemDate.toISOString().split('T')[0];

        if (itemDateStr === todayStr) {
          todayCount++;
        }

        if (
          itemDate.getMonth() === currentMonth &&
          itemDate.getFullYear() === currentYear
        ) {
          monthCount++;
        }
      }
    });

    document.getElementById("total").innerText = total;
    document.getElementById("today").innerText = todayCount;
    document.getElementById("month").innerText = monthCount;

  })
  .catch(err => {
    document.getElementById("total").innerText = "Error";
    console.error(err);
  });
</script>

  <script>
   
    
    const sheetURL="https://opensheet.elk.sh/1uzehSN2lGI6gNlM8w3eHEEbyZ14UcoRCBuOldH0Rljc/Sheet2"; 
    let data=[];
    let visibleCount=0;
    const batchSize=30;

    // Load Data
    fetch(sheetURL)
    .then(res=>res.json())
    .then(json=>{
      data=json;
      loadMore();
      populateFilters();
    });

    function loadMore(){
      const container=document.getElementById("posts");
      const slice=data.slice(visibleCount, visibleCount+batchSize);
      slice.forEach(item=>{
        if(item.Code==="7080"){
          const card=document.createElement("div");
          card.className="card";
          card.dataset.area=item.Address;
          card.dataset.cat=item.Category;
          card.dataset.code=item.Code;
          card.innerHTML=`
          <p> ${item.TimeStamp}</p>
            <p>👳‍♀️${item.Name}🏫
             ${item.Address}<br>🧕 ${item.Category} ৳${item.Price}</p>
            <button onclick="toggleDesc(this)" style="background:#4CAF50; color:white; padding:10px 12px; border:none; border-radius:5px; cursor:pointer;">পত্র</button>
            <p class="desc" style="display:none; margin-top:10px;">${item.Details || ""}</p>
           
             <a href="tel:${item.Phone}" class="order-btn">কল</a>

          
            
            
            `;
          container.appendChild(card);
        }
      });
      visibleCount+=batchSize;
      if(visibleCount>=data.length) document.getElementById("loadMoreBtn").style.display="none";
    }

 /*   <button class="order-btn" onclick='openOrderForm(${JSON.stringify(item)})'>অর্ডার</button> */
    
    function populateFilters(){
      const areaSelect=document.getElementById("areaFilter");
      const catSelect=document.getElementById("catFilter");
      const areas=new Set(), cats=new Set();
      data.forEach(item=>{if(item.Address) areas.add(item.Address); if(item.Category) cats.add(item.Category);});
      areas.forEach(a=>areaSelect.innerHTML+=`<option>${a}</option>`);
      cats.forEach(c=>catSelect.innerHTML+=`<option>${c}</option>`);
    }

    function filterPosts(){
      let search=document.getElementById("searchBox").value.toLowerCase();
      let area=document.getElementById("areaFilter").value;
      let cat=document.getElementById("catFilter").value;
      document.querySelectorAll(".card").forEach(card=>{
        let match=true;
        if(search && !card.innerText.toLowerCase().includes(search)) match=false;
        if(area && card.dataset.area!==area) match=false;
        if(cat && card.dataset.cat!==cat) match=false;
        card.style.display=match?"block":"none";
      });
    }
    
    // Accordion Toggle

  document.querySelectorAll('.accordion-btn').forEach(btn=>{

    btn.addEventListener('click', ()=>{

      let panel = btn.nextElementSibling;

      panel.style.display = (panel.style.display==="block") ? "none" : "block";

    });

  });
    
// Form Toggle support

  document.getElementById("districtList").classList.toggle("active");
}
